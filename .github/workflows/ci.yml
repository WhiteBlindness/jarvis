name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The process and containment tests start real Python processes.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Proves the worker boundary on this runner before the tests rely on
      # it (no network, no access to the Core's files, no child processes).
      # On Windows the first run also grants the interpreter's directory to
      # the worker's AppContainer identity.
      - name: Isolation check
        shell: bash
        run: |
          sed 's/^program = "python3"/program = "python"/' config/jarvis.example.toml > config/jarvis.ci.toml
          cargo run --locked -p jarvis-core -- isolation check --config config/jarvis.ci.toml
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
        env:
          JARVIS_TEST_PYTHON: python
      # Prints interpreter start-up time with and without isolation, the
      # resident memory of an idle confined interpreter, and the environment
      # the confined worker sees.
      - name: Isolation overhead
        run: cargo test -p jarvis-sandbox --test contain --locked -- --include-ignored --nocapture measure_isolation_overhead only_the_given_environment_reaches_the_worker
        env:
          JARVIS_TEST_PYTHON: python
      # The optional provisioning script, end to end on a throwaway runner:
      # install twice (idempotent), check, remove twice.
      - name: Isolation script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = 'config/jarvis.ci.toml'
          scripts/windows/isolation.ps1 -Action Install -Config $config -Yes
          scripts/windows/isolation.ps1 -Action Install -Config $config -Yes
          scripts/windows/isolation.ps1 -Action Check -Config $config
          scripts/windows/isolation.ps1 -Action Remove -Config $config -Yes
          scripts/windows/isolation.ps1 -Action Remove -Config $config -Yes

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  python:
    name: Python worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence-python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  demo:
    name: Documented quick start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: cargo build --locked -p jarvis-core
      # The README's quick start: start the Core, run a job, approve one
      # write, decline another, shut down, inspect the audit log.
      - name: Quick start
        run: ./scripts/quickstart.sh
      - name: Core log
        if: always()
        run: cat var/serve.log || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the commits of a pull request through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
